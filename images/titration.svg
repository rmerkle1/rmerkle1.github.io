<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338">
  <rect width="600" height="338" fill="#0f172a"/>
  <!-- Beaker -->
  <rect x="180" y="140" width="120" height="140" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="184" y="160" width="112" height="118" rx="6" fill="#0a2240" opacity="0.8"/>
  <!-- Solution tint (indicator pink at equivalence) -->
  <rect x="184" y="200" width="112" height="78" rx="4" fill="#ff14930a" opacity="0.6"/>
  <!-- Burette -->
  <rect x="232" y="50" width="16" height="88" rx="2" fill="#1e3a5f" stroke="#334155" stroke-width="1.5"/>
  <!-- Drop -->
  <circle cx="240" cy="148" r="4" fill="#3b82f6" opacity="0.9"/>
  <!-- Particles in beaker -->
  <circle cx="210" cy="220" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="230" cy="240" r="5" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="260" cy="215" r="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="285" cy="235" r="5" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="220" cy="260" r="4" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="270" cy="255" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="245" cy="270" r="5" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="295" cy="210" r="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Ion labels -->
  <text x="210" y="225" font-size="7" fill="white" text-anchor="middle" font-family="sans-serif">H⁺</text>
  <text x="260" y="220" font-size="7" fill="white" text-anchor="middle" font-family="sans-serif">OH⁻</text>
  <!-- Titration curve -->
  <rect x="360" y="60" width="200" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="460" y="82" font-size="11" fill="#64748b" text-anchor="middle" font-family="sans-serif">Titration Curve</text>
  <!-- Axes -->
  <line x1="390" y1="240" x2="540" y2="240" stroke="#334155" stroke-width="1.5"/>
  <line x1="390" y1="90" x2="390" y2="240" stroke="#334155" stroke-width="1.5"/>
  <text x="465" y="260" font-size="9" fill="#64748b" text-anchor="middle" font-family="sans-serif">Volume (mL)</text>
  <text x="375" y="170" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90,375,170)" font-family="sans-serif">pH</text>
  <!-- S-curve -->
  <polyline points="390,230 405,228 415,226 422,222 426,218 428,210 430,196 431,185 432,174 433,165 435,155 440,148 450,142 465,138 480,135 495,133 510,131 525,130 540,129"
    fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Equivalence point marker -->
  <circle cx="431" cy="180" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <line x1="431" y1="90" x2="431" y2="240" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Legend dots -->
  <circle cx="30" cy="300" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <text x="40" y="305" font-size="10" fill="#94a3b8" font-family="sans-serif">H⁺</text>
  <circle cx="75" cy="300" r="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="305" font-size="10" fill="#94a3b8" font-family="sans-serif">OH⁻</text>
  <circle cx="120" cy="300" r="5" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="130" y="305" font-size="10" fill="#94a3b8" font-family="sans-serif">Cl⁻</text>
  <circle cx="165" cy="300" r="5" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <text x="175" y="305" font-size="10" fill="#94a3b8" font-family="sans-serif">Na⁺</text>
  <!-- Title -->
  <text x="30" y="30" font-size="18" font-weight="bold" fill="#f1f5f9" font-family="sans-serif">Titration</text>
  <text x="30" y="48" font-size="11" fill="#64748b" font-family="sans-serif">Interactive acid-base titration visualizer</text>
</svg>
